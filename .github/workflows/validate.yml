name: Проверка дневника питания

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить синтаксис дневника
        run: node --check simple-diary.js
      - name: Проверить основные файлы и функции
        run: |
          test -s index.html
          test -s simple-diary.css
          test -s simple-diary.js
          grep -q 'simple-diary.css' index.html
          grep -q 'simple-diary.js' index.html
          grep -q 'resetPasswordForEmail' simple-diary.js
          grep -q 'newPasswordForm' simple-diary.js
          grep -q 'snack1' simple-diary.js
          grep -q 'snack2' simple-diary.js
          grep -q 'nd-meal-photos' simple-diary.js
          grep -q 'dayReviewForm' simple-diary.js
